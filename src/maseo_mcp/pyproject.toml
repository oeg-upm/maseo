[project]
name = "maseo-mcp"
version = "0.1.0"
description = "LangGraph agent + stdio MCP server for MASEO ontology generation"
requires-python = ">=3.10,<3.11"
dependencies = [
    "mcp>=1.2",
    "requests>=2.31",
    "rdflib>=7.0,<8.0",
    "langgraph>=1.0",
    "langchain-mcp-adapters>=0.3",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "langchain-ollama>=0.3",
    "pyyaml>=6.0",
]

[tool.uv]
package = false
