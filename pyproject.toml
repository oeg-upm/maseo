[project]
name = "maseo"
version = "0.2.0"
description = "A Multi-Agent System for Explainable Ontology Generation"
authors = [
    {name = "Clark"}
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "langgraph (>=1.2.12,<2.0.0)",
    "langchain-core (>=1.6.6,<2.0.0)",
    "langchain-openai (>=1.6.6,<2.0.0)",
    "langchain-ollama (>=1.1.0,<2.0.0)",
    "langchain-mcp-adapters (>=0.3.2,<0.4.0)",
    "mcp (>=1.30.0,<2.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "rdflib (>=7.6.0,<8.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
